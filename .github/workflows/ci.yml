name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint + format + file hygiene
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Build Docker image
        run: docker build -t courseup:ci .

      - name: Smoke test the image
        run: |
          docker run -d --name courseup-ci -p 8000:8000 courseup:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo && echo "health OK" && exit 0
            fi
            sleep 1
          done
          echo "health check never succeeded"
          docker logs courseup-ci
          exit 1

      - name: Stop the image
        if: always()
        run: docker rm -f courseup-ci || true

      - name: Audit dependencies for known CVEs
        run: |
          uv export --frozen --no-emit-project --all-groups -o requirements-audit.txt
          uv run pip-audit --requirement requirements-audit.txt

      - name: Scan image for known CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: courseup:ci
          scanners: vuln
          # Only the libraries we ship in the app venv — not OS packages or the
          # base image's own pip/setuptools, which we don't run and can't patch.
          vuln-type: library
          skip-dirs: /root/.cache,/usr/local/lib,/usr/lib,/usr/bin
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
