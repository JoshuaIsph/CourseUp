name: Claude

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # Automatic review of every non-draft PR (except Dependabot's — those runs
  # don't get repo secrets, so the token would be empty).
  review:
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true # TEMP debug
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on:
            - Correctness and edge cases (missing error handling, off-by-one, None/empty)
            - Security (injection, auth, secrets, unsafe deserialization)
            - Tests: are the changes covered, and are the assertions meaningful?
            - Clarity and consistency with the rest of the codebase

            The PR branch is already checked out. Use `gh pr comment` for a summary
            and `mcp__github_inline_comment__create_inline_comment` (with confirmed: true)
            for line-specific findings. Only post GitHub comments; do not reply as chat.
            If the diff is fine, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  # On-demand: someone writes "@claude ..." in a PR/issue comment.
  mention:
    if: >
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true # TEMP debug
          trigger_phrase: "@claude"
